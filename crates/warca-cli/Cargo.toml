[package]
name = "warca-cli"
version = "0.1.0"
description = "Command-line interface for a Warca vault"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "warca"
path = "src/main.rs"

[dependencies]
warca-core = { path = "../warca-core" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
rpassword = "7"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
